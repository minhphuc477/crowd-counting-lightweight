seed: 42
output_dir: runs/sha_a/direct_seed42

data:
  train_manifest: data/sha_a_train.jsonl
  val_manifest: data/sha_a_val.jsonl
  crop_size: 512
  scale_range: [0.75, 1.25]

model:
  variant: direct
  output_stride: 4
  feature_width: 32
  region_sizes_px: [16, 32, 64, 128]
  region_overlap: 0.5
  include_full_image: true
  iterations: 2
  eta_max: 1.0

loss:
  lambda_global: 0.10
  lambda_region_map: 0.20
  lambda_region_head: 0.20
  lambda_deep_supervision: 0.10
  cell_beta: 1.0
  region_beta: 2.0

train:
  batch_size: 8
  workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 1000
  warmup_epochs: 25
  eval_every: 10
  grad_clip: 5.0
  amp: true
