dataset:
  allocation_block: 16
  crop_size: 448
  flip_prob: 0.5
  hnb_blocks:
  - 16
  - 32
  - 64
  name: sha
  output_stride: 4
  part: part_A
  root: ./data/ShanghaiTech
  scale_range:
  - 0.75
  - 2.0
experiment:
  name: hpc_lite_sha
  save_dir: ./runs/sha
  seed: 42
loss:
  allocation: 0.5
  density_stratified_nb: true
  empty: 0.5
  enable_curriculum: true
  global_count: 1.0
  global_count_mode: log_smooth_l1
  hard_negative: 0.25
  hard_negative_fraction: 0.1
  hnb: 1.0
  robust: 0.1
model:
  backbone: mobilenetv4_conv_small_050
  context_dilations:
  - 1
  - 2
  - 3
  data_driven_head_bias: true
  eps_d: 1.0e-06
  feature_reductions:
  - 4
  - 8
  - 16
  neck_width: 32
  pretrained: true
  truncate_backbone: true
optimizer:
  backbone_lr: 2.5e-05
  dispersion_lr: 0.0001
  grad_clip: 1.0
  head_lr: 0.0001
  name: adamw
  weight_decay: 0.0001
robustness:
  blur_prob: 0.2
  brightness: 0.2
  contrast: 0.2
  gamma_max: 1.8
  gamma_min: 0.35
  jpeg_prob: 0.2
  noise_prob: 0.2
  salt_pepper_prob: 0.15
  saturation: 0.15
  second_view_prob: 0.3
sampler:
  density_bins: 5
  luminance_bins: 4
  power: 0.5
  weighted: true
schedule:
  cosine: true
  epochs: 2000
  warmup_fraction: 0.05
training:
  accum_steps: 1
  amp: true
  batch_size: 16
  effective_batch_size: 16
  num_workers: 0
  save_best_by: mae
