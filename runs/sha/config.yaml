augmentation:
  border_center_crop_prob: 0.1
  crop_guard_max_px: 48
  crop_guard_min_px: 8
  crop_guard_nn_factor: 0.2
  flip_prob: 0.5
  large_center_crop_prob: 0.15
  large_nn_threshold_px: 48
  max_crop_attempts: 20
  random_crop_prob: 0.75
  safe_crop: true
  scale_range:
  - 0.75
  - 2.0
  true_border_threshold_px: 32
dataset:
  allocation_block: 16
  crop_size: 448
  hnb_blocks:
  - 16
  - 32
  - 64
  name: sha
  output_stride: 4
  part: part_A
  root: ./data/ShanghaiTech
experiment:
  name: hpc_s_sr48_sha
  save_dir: ./runs/sha
  seed: 42
loss:
  density_stratified_nb: true
  enable_curriculum: true
  global_count_mode: log_smooth_l1
  hard_negative_fraction: 0.1
  lambda_alloc: 0.5
  lambda_direct: 0.5
  lambda_empty: 0.5
  lambda_global: 0.5
  lambda_hn: 0.25
  lambda_hnb: 1.0
  lambda_kd: 0.0
  lambda_rob: 0.1
  lambda_route: 0.1
  lambda_special: 0.25
  special_alloc_beta: 1.0
model:
  backbone: shufflenet_v2_x0_5
  data_driven_head_bias: true
  eps_d: 1.0e-06
  head_kernel: 5
  name: hpc_lite_sr48
  neck_width: 48
  output_stride: 4
  pool_kernels:
  - 3
  - 5
  - 7
  pool_residual_mix: 0.5
  pretrained: true
  route_temperature: 1.0
  simam_lambda: 0.0001
optimizer:
  backbone_lr: 2.5e-05
  dispersion_lr: 0.0001
  grad_clip: 1.0
  head_lr: 0.0001
  name: adamw
  weight_decay: 0.0001
robustness:
  blur_prob: 0.2
  brightness: 0.2
  contrast: 0.2
  gamma_max: 1.8
  gamma_min: 0.35
  jpeg_prob: 0.2
  noise_prob: 0.2
  salt_pepper_prob: 0.15
  saturation: 0.15
  second_view_prob: 0.3
sampler:
  density_bins: 5
  luminance_bins: 4
  power: 0.5
  weighted: true
schedule:
  cosine: true
  epochs: 2000
  warmup_fraction: 0.05
training:
  accum_steps: 1
  amp: true
  batch_size: 16
  effective_batch_size: 16
  num_workers: 0
  save_best_by: mae
