augmentation:
  flip_prob: 0.5
  scale_range:
  - 0.75
  - 2.0
dataset:
  allocation_block: 16
  crop_size: 448
  hnb_blocks:
  - 8
  - 16
  - 32
  - 64
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
  name: sha
  output_stride: 4
  part: part_A
  root: ./data/ShanghaiTech
experiment:
  name: sha_hpc_lite_a1_root64
  save_dir: ./runs/sha_hpc_lite_a1_root64
  seed: 42
hard_zero:
  block_size: 16
  enabled: false
  loss: smooth_l1
  top_fraction: 0.1
  weight: 0.0
local_contrast:
  block_size: 16
  enabled: false
  hidden_dim: 64
  max_samples: 256
  projection_dim: 32
  temperature: 0.1
  weight: 0.0
model:
  backbone: mobilenetv4_conv_small_050
  context_dilations:
  - 1
  - 2
  - 3
  eps_d: 1.0e-06
  init_checkpoint: null
  name: hpc_lite
  neck_width: 32
  pretrained: true
  truncate_backbone: true
  use_p8_context: true
  use_repblock: false
optimizer:
  differential_lr:
    existing: 5.0e-05
    new_training_modules: 0.0001
  grad_clip: 5.0
  weight_decay: 0.0001
prob_tree:
  distribution: multinomial
  kappa_16_8: 20.0
  kappa_32_16: 20.0
  kappa_64_32: 20.0
  kappa_root64: 20.0
  weights:
    16_to_8_dense: 0.0
    32_to_16: 0.0
    64_to_32: 0.0
    root_nb: 1.0
    root_to_64: 1.0
sampler:
  density_bins: 5
  luminance_bins: 4
  power: 0.5
  weighted: true
schedule:
  epochs: 300
  warmup_epochs: 15
statistics:
  dense_threshold_16: 2
  local_t1: 1
  local_t2: 2
  root_dispersion: 50.0
training:
  amp: true
  batch_size: 16
  init_scale: 256.0
  num_workers: 0
  validate_every: 5
