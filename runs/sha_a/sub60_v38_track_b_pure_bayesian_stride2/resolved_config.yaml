seed: 42
data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
  - 0.7
  - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  pad_small_images: true
model:
  output_stride: 2
  subpixel_stride2: true
  subpixel_dm: false
  feature_width: 80
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763
  max_trainable_params: 200000
  neck_type: hdc_lite
  use_aspp_gap: true
  hdc_dilations:
  - 1
  - 2
  - 3
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  regional_feature_stats: mean
  region_head_hidden: 140
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false
  enable_solver: true
  solver_mode: additive
  iterations: 6
  omega: 1.0
  residual_clip: 0.0
  eps: 1.0e-06
  adjoint_mode: radon_nikodym
  morozov_gamma: 0.75
  morozov_rho_cap: 0.25
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  trust_region_kappa: 0.35
  trust_region_floor: 0.005
  use_barzilai_borwein: true
  use_scale_entropy_trust: true
  tv_lambda: 0.02
  tv_type: laplacian
  density_gated_diffusion: true
  diffusion_dense_threshold: 0.12
  diffusion_gate_beta: 0.03
  proximal_tau: 0.015
  proximal_mode: firm
  proximal_mu: 3.0
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0
  hurdle_head: false
  hurdle_gating_mode: disabled
  faithful_dispersion_detach: true
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999
  density_curvature: false
  gated_density_curvature: false
  asymmetric_trust: false
loss:
  allocation_loss_type: bayesian
  bayesian_sigma: 3.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 1.5
  bayesian_sigma_max: 3.0
  bayesian_background_ratio: 0.1
  bayesian_norm_mode: canonical
  bayesian_canonical_bg: true
  dm_target: dual
  lambda_count: 1.0
  lambda_bayesian: 1.0
  lambda_flat_dm16: 0.0
  lambda_cell: 0.0
  lambda_region_nb: 0.0
  regional_nb_beta: 0.0
  faithful_regional_nb: false
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  count_loss_mode: l1
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0
train:
  device: cuda
  epochs: 1000
  batch_size: 8
  workers: 2
  num_threads: 2
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 10
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false
eval:
  density_bins:
  - 100.0
  - 500.0
output_dir: runs/sha_a/sub60_v38_track_b_pure_bayesian_stride2
