augmentation:
  flip_prob: 0.5
  scale_range:
  - 0.75
  - 2.0
dataset:
  allocation_block: 16
  crop_size: 256
  hnb_blocks:
  - 8
  - 16
  - 32
  - 64
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
  name: sha
  output_stride: 4
  part: part_A
  root: ./data/ShanghaiTech
experiment:
  name: ntpc_r1_sdc_deterministic
  save_dir: ./runs/ntpc_r1_sdc_deterministic
  seed: 42
loss:
  mode: r1_deterministic
  w_deterministic_alloc: 1.0
  w_root_nb: 1.0
model:
  backbone: mobilenetv4_conv_small_050
  context_dilations:
  - 1
  - 2
  - 3
  eps_d: 1.0e-06
  init_checkpoint: null
  name: hpc_lite
  neck_width: 32
  pretrained: false
  truncate_backbone: true
  use_p8_context: true
  use_repblock: false
optimizer:
  grad_clip: 5.0
  lr: 0.0001
  name: AdamW
  weight_decay: 0.0001
sampler:
  density_bins: 5
  luminance_bins: 4
  power: 0.5
  weighted: true
schedule:
  epochs: 1000
  warmup_epochs: 25
statistics:
  root_dispersion: 50.0
training:
  amp: true
  batch_size: 16
  init_scale: 256.0
  num_workers: 0
  validate_every: 5
