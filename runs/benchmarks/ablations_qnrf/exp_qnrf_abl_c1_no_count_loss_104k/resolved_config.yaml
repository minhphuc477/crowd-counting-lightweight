seed: 42
data:
  train_manifest: data/qnrf_train.jsonl
  val_manifest: data/qnrf_test.jsonl
  data_root: data
  crop_size: 512
  pad_small_images: true
  max_size: 2048
  scale_range:
  - 0.6
  - 1.4
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.3
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale:
  - 0.005
  - 0.03
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_max_patches: 3
model:
  output_stride: 2
  subpixel_stride2: true
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: false
  backbone_lr_scale: 1.0
  init_m0: 0.001498
  neck_type: aspp_lite
  aspp_dilations:
  - 2
  - 4
  - 8
  use_aspp_gap: true
  enable_solver: false
  solver_mode: direct
  eps: 1.0e-06
loss:
  output_stride: 2
  allocation_loss_type: dual_bayesian_radon_ot
  bayesian_sigma: 8.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 8.0
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true
  lambda_radon_ot: 0.85
  radon_ot_projections: 4
  radon_ot_norm_ref: 100.0
  dm_target: dual
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  lambda_bayesian: 0.15
  lambda_flat_dm16: 0.0
  lambda_region_nb: 0.0
  lambda_count: 0.0
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0
train:
  epochs: 1000
  batch_size: 8
  warmup_epochs: 10
  weight_decay: 0.0001
  ema_decay: 0.999
  lr: 0.0005
  amp: true
  eval_every: 5
  grad_clip: 1.0
  deterministic: true
eval:
  density_bins:
  - 200.0
  - 1000.0
output_dir: runs/benchmarks/ablations_qnrf/exp_qnrf_abl_c1_no_count_loss_104k
