name: Test Suite & Model Verification

on:
  push:
    branches: [ RMR, main, master ]
  pull_request:
    branches: [ RMR, main, master ]

jobs:
  pytest:
    name: Pytest (RMR-v3 & RMR Regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm scipy numpy pyyaml pillow pytest
          pip install -e .

      - name: Run Core Test Suite
        run: |
          pytest tests/core/ -v --tb=short

      - name: Run RMR-v2 Test Suite
        run: |
          pytest tests/rmr_v2/ -v --tb=short

      - name: Run RMR-v3 Test Suite
        run: |
          pytest tests/rmr_v3/ -v --tb=short

      - name: Run RMR Regression Test Suite
        run: |
          pytest tests/rmr/ -v --tb=short
