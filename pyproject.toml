[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-lite"
version = "0.1.0"
description = "Neural Tree-Polya Crowd Counting (NTPC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.10",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hpc*", "rmr_count*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
