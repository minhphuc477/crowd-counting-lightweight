# Central State Tracking for Ultra-Lightweight Crowd Counting Research
project: lightweightcrcn
objective: "Break the capacity chasm in crowd counting: achieve competitive MAE on ShanghaiTech Part A under <= 105,000 trainable parameters with zero knowledge distillation."
current_state: "Experiment suite designed, all 8 single-variable configurations created and validated, ready for sequential execution."

constraints:
  max_trainable_parameters: 105000
  knowledge_distillation: false
  external_teacher: false
  dataset: "ShanghaiTech Part A Canonical (300 Train / 182 Test)"
  output_stride: 4
  max_code_lines_per_file: 450
  deterministic: false

ground_truth_anchor:
  version: "RMR-v19 Canonical"
  checkpoint: "runs/sha_a/rmr_v19_canonical_isotropic/best_val_mae.pt"
  trainable_params: 104441
  direct_mae: 72.84
  direct_rmse: 110.57
  tta_mae: 72.61
  tta_rmse: 109.98
  mae_ci95: [61.13, 85.10]
  sparse_mae: 20.01
  moderate_mae: 55.85
  dense_mae: 127.64
  solver_contribution_mae: -13.82

