# T2: Full DTM Tree to 4 (64 -> 32 -> 16 -> 8 -> 4)
experiment:
  name: ntpc_t2_dtm_tree4
  seed: 42
  save_dir: ./runs/ntpc_t2_dtm_tree4

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 256
  output_stride: 4
  hnb_blocks: [4, 8, 16, 32, 64]
  allocation_block: 4
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

model:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  pretrained: false
  neck_width: 32
  context_dilations: [1, 2, 3]
  use_p8_context: false
  use_repblock: false
  eps_d: 1.0e-8
  truncate_backbone: true
  init_checkpoint: null

statistics:
  root_dispersion: 50.0

loss:
  mode: r4_dtm_tree4
  root_loss: nb
  kappa_root64: 20.0
  kappa_64_32: 20.0
  kappa_32_16: 20.0
  kappa_16_8: 20.0
  kappa_8_4: 20.0
  w_root_nb: 1.0
  w_root64: 1.0
  w_64_32: 1.0
  w_32_16: 1.0
  w_16_8: 1.0
  w_8_4: 1.0

augmentation:
  scale_range: [0.7, 1.3]
  flip_prob: 0.5
  crop_sampling: uniform

sampler:
  weighted: false
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 25

training:
  batch_size: 16
  amp: true
  init_scale: 256.0
  num_workers: 0
  evaluate_every: 5
  gradient_audit_every: 50
