# T1: DTM Tree to 8 (64 -> 32 -> 16 -> 8)
experiment:
  name: ntpc_t1_dtm_tree8
  seed: 42
  save_dir: ./runs/ntpc_t1_dtm_tree8

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 256
  output_stride: 4
  hnb_blocks: [8, 16, 32, 64]
  allocation_block: 8
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

model:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  pretrained: false
  neck_width: 32
  context_dilations: [1, 2, 3]
  use_p8_context: true
  use_repblock: false
  eps_d: 1.0e-6
  truncate_backbone: true
  init_checkpoint: null

statistics:
  root_dispersion: 50.0

loss:
  mode: r4_dtm_tree8
  kappa_root64: 20.0
  kappa_64_32: 20.0
  kappa_32_16: 20.0
  kappa_16_8: 20.0
  w_root_nb: 1.0
  w_root64: 1.0
  w_64_32: 1.0
  w_32_16: 1.0
  w_16_8: 1.0

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 25

training:
  batch_size: 16
  amp: true
  init_scale: 256.0
  num_workers: 0
  validate_every: 5
