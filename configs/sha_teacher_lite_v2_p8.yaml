# Experiment T2-B: TeacherLite v2 with P8 + P16 Multi-Dilation Context (Trained From Scratch)
experiment:
  name: sha_teacher_lite_v2_p8
  seed: 42
  save_dir: ./runs/sha_teacher_lite_v2_p8

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

model:
  teacher:
    name: teacher_lite
    backbone: efficientnet_b0
    fpn_width: 96
    pretrained: true
    use_p8_context: true
    eps_d: 1.0e-6

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5

loss:
  lambda_map: 1.0
  positive_cell_weight: 3.0
  lambda_ms: 1.0
  lambda_count_map: 0.50
  lambda_count_reg: 0.25
  lambda_consistency: 0.10
  lambda_hn: 0.10
  hard_negative_fraction: 0.10
  count_scale: 100.0
  multiscale_mae:
    weight: 1.0
    blocks: [16, 32, 64]

optimizer:
  type: adamw
  backbone_lr: 5.0e-5
  task_lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 50

training:
  batch_size: 8
  accum_steps: 2
  amp: true
  validate_every: 5
  num_workers: 0
