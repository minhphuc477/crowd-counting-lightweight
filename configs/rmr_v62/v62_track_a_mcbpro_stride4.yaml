# V62 Experiment 2: Track A - Stride 4 with MC-BPRO & Rep-HDC Neck
# Mathematical Invariant 1: Strictly <= 104,441 params (Actual: 104,359 params)
# Mathematical Invariant 2: 100% Standalone (0.0% Knowledge Distillation, Zero Teachers)
# Core Innovations:
# 1. Closed-Form MC-BPRO Measure Recovery Solver (T=1, 0 params):
#    - Space-Variant Deficit Seeding g(u) restores missed heads into foreground valleys
#    - Regional Presence Mask m_reg(u) guarantees 0.000% leakage on empty background
#    - Unbounded Linear Bregman Projection s_R = b_R / mu_aug
# 2. Rep-HDC Lite Neck with continuous dilations [1, 2, 3] (Zero Gridding Holes) + GAP Global Context
# 3. Purified Orthogonal Loss Triad: Micro-Allocation + Macro Faithful Beta-NB + Global Count L1
seed: 42
data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
  - 0.7
  - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0

model:
  output_stride: 4
  subpixel_stride2: false
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763

  # Rep-HDC Lite Neck (Wang et al. WACV 2018): Dilations [1, 2, 3] eliminate gridding holes
  neck_type: rep_aspp_lite
  aspp_dilations:
  - 1
  - 2
  - 3
  use_aspp_gap: true

  # Multiscale Regional Evidence Dictionary
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  use_diag: false
  native_scale_pooling: true
  regional_feature_stats: mean
  region_head_hidden: 48
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false

  # Fine Carrier Head on Stride 4 Lattice
  head_blocks: 1
  hurdle_head: false
  density_curvature: false
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999

  # Closed-Form MC-BPRO Inverse Solver (0 Parameters, O(1) Latency)
  enable_solver: true
  solver_mode: mcbpro
  mcbpro_deficit_seeding: true
  mcbpro_valley_power: 2.0
  mcbpro_reg_threshold: 0.001
  eps: 1.0e-06
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0

loss:
  output_stride: 4
  allocation_loss_type: flat_dm16
  dm_block_px: 32
  kappa_flat16: 20.0
  normalize_flat_dm16: true
  dm_norm_mode: unnorm_ref
  dm_ref_count: 100.0
  dm_target: dual
  count_loss_mode: nb
  count_nb_dispersion: 50.0

  # Purified Orthogonal 3-Loss Suite
  # 1. Micro-Allocation (Flat DM16 on carrier y0)
  lambda_flat_dm16: 1.0
  # 2. Macro-Regional Count (Faithful Beta-NB NLL on b_R: unbiased gradient on dense clusters)
  lambda_region_nb: 0.5
  faithful_regional_nb: true
  regional_nb_beta: 1.0
  normalize_beta_weights: false
  # 3. Global Count Conservation (Negative-Binomial count loss on recovered measure y*)
  lambda_count: 0.5

  # All 7 Conflicting Auxiliary Losses Eliminated
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 1000
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 10
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 0
  solver_ramp_epochs: 10
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
  - 100.0
  - 500.0

output_dir: runs/sha_a/rmr_v62/v62_track_a_mcbpro_stride4
