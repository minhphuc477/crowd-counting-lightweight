augmentation:
  flip_prob: 0.5
  scale_range:
  - 0.7
  - 1.3
  vflip_prob: 0.5
dataset:
  coordinate_base: 0
  crop_size: 256
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
experiment:
  description: Local Count Baseline (SmoothL1 on Y) [capacity sweep, neck_width=32]
  model_id: B1
  name: capacity_sweep_b1_w32
  save_dir: ./runs/capacity_sweep/b1_w32
  seed: 42
loss:
  mode: local_smooth_l1
model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  context_dilations:
  - 1
  - 2
  - 3
  eps_d: 1.0e-08
  head_type: local
  neck_width: 32
  output_stride: 16
  pretrained: true
  use_integral_context: false
optimizer:
  backbone_lr_scale: 0.1
  grad_clip: 5.0
  lr: 0.0001
  name: AdamW
  weight_decay: 0.0001
schedule:
  epochs: 1000
  warmup_epochs: 25
training:
  amp: true
  batch_size: 16
  drop_last: true
  evaluate_every: 5
  num_workers: 2
