augmentation:
  flip_prob: 0.5
  scale_range:
    - 0.7
    - 1.3
  vflip_prob: 0.5

dataset:
  coordinate_base: 0
  crop_size: 256
  image_mean:
    - 0.5
    - 0.5
    - 0.5
  image_std:
    - 0.5
    - 0.5
    - 0.5
  name: sha
  part: part_A
  root: ./data/ShanghaiTech

experiment:
  description: >
    PS-FH-CMICF s8, K4: strict-local K4 cumulative charts at output stride 8,
    fractional prefix preconditioning, Sobolev mixed-difference supervision,
    augmented-Lagrangian 2-increasing constraint.
  model_id: PSFH_S8_K4
  name: ps_fh_cmicf_s8_k4
  save_dir: ./runs/pilot_micf/psfh_s8_k4
  seed: 42

model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  neck_width: 32

  context_dilations:
    - 1
    - 2
    - 3

  use_integral_context: true
  context_type: directional

  head_type: cumulative
  extent_aware: true

  # S8, K4 GEOMETRY:
  output_stride: 8
  finite_horizon: 4

  # PS-FH strict-local and normalization switch
  fh_strict_local: true
  fh_local_norm: group

  eps_d: 1.0e-08

loss:
  mode: ps_fh_cmicf

  precondition_alpha: 0.5
  precondition_sv_floor: 1.0e-08

  lambda_sobolev: 1.0
  sobolev_beta: 1.0

  lambda_count: 1.0

  al_rho: 1.0
  al_dual_init: 0.0
  al_dual_max: 100.0
  al_update_mode: dual_ascent

  norm_eps: 1.0

optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 25

training:
  amp: true
  batch_size: 16
  drop_last: true
  evaluate_every: 5
  num_workers: 0
  pin_memory: false
