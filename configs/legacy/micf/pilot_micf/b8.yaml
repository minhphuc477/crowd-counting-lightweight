augmentation:
  flip_prob: 0.5
  scale_range:
  - 0.7
  - 1.3
  vflip_prob: 0.5
dataset:
  coordinate_base: 0
  crop_size: 256
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
experiment:
  description: FH-CMICF K4 (Block-Scoped 4-dir Context + Local Extent-Aware Head +
    Exact Global Composition)
  model_id: B8
  name: pilot_micf_b8
  save_dir: ./runs/pilot_micf/b8_k4
  seed: 42
loss:
  field_loss: smooth_l1
  lambda_local_recon: 0.0
  lambda_valid: 1.0
  mode: micf_v2_full
  norm_eps: 1.0
  normalize_by: total_count
model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  context_dilations:
  - 1
  - 2
  - 3
  context_type: directional
  eps_d: 1.0e-08
  extent_aware: true
  finite_horizon: 4
  head_type: cumulative
  neck_width: 32
  output_stride: 16
  pretrained: true
  use_integral_context: true
optimizer:
  backbone_lr_scale: 0.1
  grad_clip: 5.0
  lr: 0.0001
  name: AdamW
  weight_decay: 0.0001
schedule:
  epochs: 1000
  warmup_epochs: 25
training:
  amp: true
  batch_size: 16
  drop_last: true
  evaluate_every: 5
  num_workers: 0
  pin_memory: false
