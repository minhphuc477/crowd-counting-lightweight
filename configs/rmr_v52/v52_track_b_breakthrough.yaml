# V52 Breakthrough Synthesis Architecture - Track B: RepASPP-Lite (Width=64) + Subpixel Stride 2 + Dual Point-Macro Supervision
# Parameter Budget: Strictly <= 200,000 trainable parameters (Actual: ~136,150 params, 0.0% Knowledge Distillation)
# Standalone single-model configuration for ShanghaiTech Part A
seed: 42
data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
  - 0.7
  - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0

model:
  output_stride: 2
  feature_width: 64
  max_trainable_params: 200000
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763

  # Multi-Scale Neck: RepASPPLite with feature width 64 (dilations 1, 3, 6 + Global Average Pooling)
  neck_type: rep_aspp_lite
  use_aspp_gap: true
  aspp_dilations:
  - 1
  - 3
  - 6

  # Subpixel Stride 2: PixelShuffle(2) outputs 256x256 without extra parameters, reducing <4px cell collision from 38.3% to <8.4%
  subpixel_stride2: true

  # Regional Evidence: Native Multi-Scale extraction (32px -> P4, 64px -> P8, 128px -> P16) with mean_std stats
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  native_scale_pooling: true
  regional_feature_stats: mean_std
  region_head_hidden: 64
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0

  # Scale Routing: Continuous perspective scale steering + Density-Gated Scale Suppression (DGSS)
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  density_scale_gating: true
  density_scale_tau: 0.15

  # Hurdle & Density Gating: Clean occupancy mode preserving 100% mass on b >= 1.0
  hurdle_head: false
  hurdle_gating_mode: occupancy

  # Carrier Head: Temperature softplus + Gated Padé [1/1] Curvature for dense clusters + Scale Prior Boost
  temp_softplus: true
  density_curvature: true
  gated_density_curvature: true
  curvature_dense_threshold: 0.15
  curvature_gate_beta: 0.03
  curvature_pool_kernel: 8
  curvature_alpha_init: -1.5
  scale_prior_boost: 0.20

  # Unrolled SIRT Inverse Solver (T=6 iterations, Barzilai-Borwein, Radon-Nikodym adjoint)
  enable_solver: true
  solver_mode: additive
  iterations: 6
  omega: 1.0
  residual_clip: 0.0
  eps: 1.0e-06
  adjoint_mode: radon_nikodym

  # Density-Adaptive & Asymmetric Morozov: Deadband automatically shrinks on dense boxes and undercounting
  morozov_gamma: 0.75
  multiscale_morozov: true
  morozov_scale_beta: 1.0
  density_adaptive_morozov: true
  morozov_density_beta: 2.0
  asymmetric_morozov: true
  morozov_gamma_under: 0.20
  morozov_rho: 0.30

  # Deficit Carrier Seeding: Injects positive support in under-counting deficit regions
  deficit_carrier_seeding: true
  deficit_seed_eps: 0.02

  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true

  # Density-Adaptive Trust Region: Expands kappa from 0.35 to 0.80 in dense clusters
  trust_region_kappa: 0.35
  trust_region_floor: 0.005
  density_adaptive_trust: true
  trust_dense_tau: 0.10
  trust_dense_kappa: 0.80

  tv_lambda: 0.02
  tv_type: laplacian
  proximal_tau: 0.015
  proximal_mode: firm
  proximal_mu: 3.0
  use_barzilai_borwein: true
  use_scale_entropy_trust: true
  asymmetric_trust: false
  ema_decay: 0.999

loss:
  output_stride: 2
  # Dual Point-Macro Supervision: Adaptive Bayesian (unit per-head pull) + Flat DM16 (macro block boundary)
  allocation_loss_type: dual_bayesian_dm16
  bayesian_sigma: 4.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 4.0
  bayesian_background_ratio: 0.10
  bayesian_norm_mode: canonical
  bayesian_canonical_bg: true

  kappa_flat16: 20.0
  normalize_flat_dm16: true
  dm_target: dual

  lambda_count: 1.0
  lambda_bayesian: 0.035
  lambda_flat_dm16: 0.10
  count_loss_mode: nb
  count_nb_dispersion: 50.0

  # Faithful Beta-NB regional loss with variance-detached gradient scaling (ICLR 2022)
  lambda_region_nb: 0.20
  faithful_regional_nb: true
  regional_nb_beta: 0.5

  # Count-Harmonized Cell Loss with power 0.0 (unnormalized foreground pulls without gradient decay)
  lambda_cell: 0.35
  cell_loss_mode: count_harmonized
  cell_beta: 1.0
  cell_mass_weight_eps: 0.001
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25
  cell_fg_ratio: 0.67
  cell_norm_power: 0.0
  cell_norm_ref: 100.0

  # Eliminate conflicting auxiliary heuristics
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 750
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  scheduler_type: wsd
  wsd_stable_ratio: 0.85
  warmup_epochs: 10
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
  - 100.0
  - 500.0

output_dir: runs/sha_a/v52_track_b_breakthrough
