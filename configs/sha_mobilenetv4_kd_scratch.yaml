# MobileNetV4 + MS-MAE + Teacher KD Training From Scratch (Full 1500 Epochs)
experiment:
  name: mobilenetv4_ms_mae_kd_scratch
  seed: 42
  save_dir: ./runs/mobilenetv4_ms_mae_kd_scratch

student:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  pretrained: true
  neck_width: 32
  deployment_architecture_unchanged: true

teacher:
  type: teacher_lite
  width: 96
  checkpoint: ./runs/sha_teacher_lite/best.pt
  frozen: true

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

student_ground_truth_loss:
  lambda_count: 1.0
  count_scale: 100.0
  lambda_point: 0.0
  lambda_ms_mae: 1.0
  lambda_hnb: 0.25
  lambda_alloc: 0.0
  lambda_hn: 0.10
  lambda_empty: 0.25
  lambda_global: 0.10
  lambda_rob: 0.05
  lambda_route: 0.0
  hard_negative_fraction: 0.10
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false
  enable_curriculum: false

kd:
  kd_dim: 64
  student_channels:
    p4: 32
    p8: 32
    p16: 32
  teacher_channels:
    p4: 96
    p8: 96
    p16: 96
  lambda_feat: 0.10
  lambda_energy: 0.05
  lambda_relation: 0.05
  lambda_map: 0.20
  lambda_count: 0.05
  reliability_gate: true
  ramp_start: 0.05
  ramp_full: 0.20

optimizer:
  type: adamw
  student_lr: 1.0e-4
  kd_projector_lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 1500
  warmup_epochs: 50

training:
  batch_size: 16
  num_workers: 0
  amp: true
  validate_every: 5
