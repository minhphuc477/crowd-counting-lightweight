experiment:
  name: ntpc_r0_exact_regression
  seed: 42
  save_dir: ./runs/ntpc_r0_exact_regression
dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 256
  output_stride: 4
  hnb_blocks:
  - 8
  - 16
  - 32
  - 64
  allocation_block: 16
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
model:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  pretrained: false
  neck_width: 32
  context_dilations:
  - 1
  - 2
  - 3
  use_p8_context: false
  use_repblock: false
  eps_d: 1.0e-08
  init_checkpoint: null
loss:
  mode: r0_exact
  w_exact_regression: 1.0
augmentation:
  scale_range:
  - 0.7
  - 1.3
  flip_prob: 0.5
  crop_sampling: uniform
sampler:
  weighted: false
  density_bins: 5
  luminance_bins: 4
  power: 0.5
optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0
schedule:
  epochs: 1000
  warmup_epochs: 25
training:
  batch_size: 16
  amp: true
  init_scale: 256.0
  num_workers: 0
  evaluate_every: 5
  gradient_audit_every: 50
