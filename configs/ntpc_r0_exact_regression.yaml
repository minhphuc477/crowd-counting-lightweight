experiment:
  name: ntpc_r0_exact_regression
  seed: 42
  save_dir: ./runs/ntpc_r0_exact_regression

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 256
  coordinate_base: 1
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

model:
  backbone: mobilenetv4_conv_small_050
  pretrained: false
  neck_width: 32
  context_dilations: [1, 2, 3]
  use_p8_context: false
  use_repblock: false
  eps_d: 1.0e-08
  output_stride: 4

statistics:
  seed: 12345
  root_dispersion: 50.0
  max_samples: null
  crops_per_image: 3

loss:
  mode: r0_exact
  root_loss: nb
  w_root_nb: 1.0
  w_exact_regression: 1.0

augmentation:
  scale_range: [0.7, 1.3]
  flip_prob: 0.5

sampler:
  weighted: false

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 25

training:
  batch_size: 16
  drop_last: true
  amp: true
  init_scale: 256.0
  num_workers: 0
  evaluate_every: 5
  gradient_audit_every: 50
