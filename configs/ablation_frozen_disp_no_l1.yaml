# Ablation 3B: Frozen Dispersion only (lambda_count=0.0)
experiment:
  name: ablation_frozen_disp_no_l1
  seed: 42
  save_dir: ./runs/ablation_frozen_disp_no_l1

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16

model:
  name: hpc_lite_sr48
  backbone: shufflenet_v2_x0_5
  pretrained: false
  neck_width: 48
  route_temperature: 1.0
  pool_kernels: [3, 5, 7]
  pool_residual_mix: 0.5
  simam_lambda: 1.0e-4
  head_kernel: 5
  output_stride: 4
  eps_d: 1.0e-6
  data_driven_head_bias: false

loss:
  lambda_count: 0.0               # ABLATION: NO Direct Count L1
  count_scale: 100.0
  lambda_point: 0.0
  lambda_hnb: 1.0                 # HNB primary (as in old objective)
  lambda_alloc: 0.50
  lambda_hn: 0.25
  lambda_empty: 0.50
  lambda_global: 0.50
  lambda_rob: 0.05
  lambda_route: 0.10
  hard_negative_fraction: 0.10
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false         # Frozen dispersion
  enable_curriculum: false

augmentation:
  scale_range: [0.80, 1.20]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.0

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: adamw
  lr: 2.0e-5
  lr_start: 2.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

schedule:
  epochs: 100
  warmup_epochs: 0
  cosine: true

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  save_best_by: mae
