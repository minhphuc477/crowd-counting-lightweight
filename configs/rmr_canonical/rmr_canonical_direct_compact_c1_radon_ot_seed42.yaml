# ==============================================================================
# RMR CANONICAL BENCHMARK: DIRECT STANDALONE + COMPACT-C1 + DUAL BAYESIAN/RADON-OT
# Seed 42 | Track A (<= 104,441 Parameters Ceiling)
# Target: ShanghaiTech Part A (182 Full Test Images, 0.0% Distillation)
# Architecture: Direct Single-Pass MobileNetV4-Conv-Small (Zero Solver)
# Activation: C1-Continuous Compact Support Activation (Exact Background Pruning)
# Supervision: Dual Bayesian Point Anchor (0.15) + Radon Sliced Wasserstein (0.85)
# Purpose: Ablation Loss Formulation (Direct+CompactC1+SN-VP vs Direct+CompactC1+RadonOT)
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  pad_small_images: true
  scale_range:
  - 0.60
  - 1.40
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.30
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale:
  - 0.005
  - 0.03
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_max_patches: 3

model:
  output_stride: 4
  subpixel_stride2: false
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763

  # ASPP-Lite Neck with Dilations [2, 4, 8]
  neck_type: aspp_lite
  aspp_dilations:
  - 2
  - 4
  - 8
  use_aspp_gap: true

  # Multiscale Regional Evidence Dictionary (Passive/Shared)
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  regional_feature_stats: mean
  region_head_hidden: 48
  dynamic_scale_routing: false
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: false
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  hurdle_head: false

  # Direct Carrier: Solver Completely Bypassed (Occam Principle)
  enable_solver: false
  allow_unsupervised_solver: true
  solver_mode: direct

  # Compact-C1 Density Activation (Strict Zero Background Support)
  head_activation: compact_c1
  temp_softplus: false
  density_curvature: false
  gated_density_curvature: false
  floor_tau: 0.5
  eps: 1.0e-06

loss:
  output_stride: 4
  dm_target: y0

  # Dual Supervision: Bayesian Point Anchor + Radon Sliced Wasserstein
  allocation_loss_type: dual_bayesian_radon_ot
  bayesian_sigma: 4.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 4.0
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true

  # Radon-OT parameters
  lambda_radon_ot: 0.85
  radon_ot_projections: 4
  radon_ot_norm_ref: 100.0

  count_loss_mode: nb
  count_nb_dispersion: 50.0

  lambda_bayesian: 0.15
  lambda_flat_dm16: 0.0
  lambda_region_nb: 0.5
  faithful_regional_nb: true
  regional_nb_beta: 1.0
  normalize_beta_weights: true
  lambda_count: 0.5

  lambda_sn_vp: 0.0
  lambda_carrier_cell: 0.0
  lambda_fine_cell: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0
  lambda_curvature: 0.0
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_spectral: 0.0
  lambda_spectral_dc: 0.0
  lambda_ot: 0.0
  lambda_chfl: 0.0
  lambda_fidt: 0.0

  # Strict Multi-Task Loss Invariant Override
  strict_loss_triad: false

train:
  epochs: 1500
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 15
  min_lr_ratio: 0.20
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 0
  solver_ramp_epochs: 10
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: true
  allow_unsupervised_solver: true

eval:
  density_bins:
  - 100.0
  - 500.0

output_dir: runs/canonical/rmr_canonical_direct_compact_c1_radon_ot_seed42
