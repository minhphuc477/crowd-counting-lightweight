# ==============================================================================
# RMR CANONICAL BENCHMARK: SUBPIXEL STRIDE-2 (TRACK A, <= 104,441 PARAMS) - SEED 42
# Official Publication-Grade Subpixel Stride-2 Architecture Specification
# Target: ShanghaiTech Part A (182 Full Test Images, 0.0% Knowledge Distillation)
# Exact Trainable Parameters: 104,227 params (Strictly <= 104,441 ceiling)
# Output Stride: 2 (256x256 subpixel lattice on 512x512 crop)
# Full Model: Closed-Form MC-BPRO Bregman Transport Solver (enable_solver: true)
# Supervision: Dual-Bayesian Point Anchor (0.15) + 1D Sliced Radon-OT (0.85)
# Purpose: Direct Stride 4 vs Stride 2 Nyquist Spatial Crowding Ablation (Table 4)
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  pad_small_images: true
  scale_range:
  - 0.60
  - 1.40
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.30
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale:
  - 0.005
  - 0.03
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_max_patches: 3

model:
  output_stride: 2
  subpixel_stride2: true
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  # init_m0 scaled by 1/4 to preserve total expected mass on 4x finer grid
  init_m0: 0.00394075

  # ASPP-Lite Neck with Dilations [2, 4, 8]
  neck_type: aspp_lite
  aspp_dilations:
  - 2
  - 4
  - 8
  use_aspp_gap: true

  # Multiscale Regional Evidence Dictionary (Hidden: 46 for exact parameter compliance)
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  use_diag: false
  native_scale_pooling: true
  regional_feature_stats: mean
  region_head_hidden: 46
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  hurdle_head: false

  # Closed-Form MC-BPRO Transport Solver
  enable_solver: true
  solver_mode: mcbpro
  mcbpro_deficit_seeding: true
  mcbpro_valley_power: 2.0
  mcbpro_reg_threshold: 0.001
  mcbpro_peak_kernel_size: 5
  tau_peak: 0.05
  ratio_clamp_max: 25.0
  detach_region_mean_in_solver: false
  detach_reliability_in_solver: false
  uniform_reliability: false
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  floor_tau: 0.00075
  eps: 1.0e-06

loss:
  output_stride: 2
  # Stride-2 Dual Supervision: Bayesian Point Anchor + Radon Sliced Wasserstein
  allocation_loss_type: dual_bayesian_radon_ot
  bayesian_sigma: 4.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 4.0
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true

  # Radon-OT parameters
  lambda_radon_ot: 0.85
  radon_ot_projections: 4
  radon_ot_norm_ref: 100.0

  dm_target: dual
  count_loss_mode: nb
  count_nb_dispersion: 50.0

  # Synergistic Loss Formulation
  lambda_bayesian: 0.15
  lambda_flat_dm16: 0.0
  lambda_region_nb: 0.5
  faithful_regional_nb: true
  regional_nb_beta: 1.0
  normalize_beta_weights: true
  lambda_count: 0.5

  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 1500
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 15
  min_lr_ratio: 0.20
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 0
  solver_ramp_epochs: 10
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: true

eval:
  density_bins:
  - 100.0
  - 500.0

output_dir: runs/canonical/rmr_canonical_stride2_104k_seed42
