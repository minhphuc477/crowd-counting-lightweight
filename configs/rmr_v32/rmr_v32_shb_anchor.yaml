seed: 42
# RMR-v32 Multi-Dataset Benchmark: ShanghaiTech Part B Anchor
# Target: Verify Cross-Dataset Generalization on ShanghaiTech Part B (400 Train / 316 Test)
# Parameter count: exactly 104,441 (strictly <= 105,000 budget, 559 headroom)
# Zero Knowledge Distillation / Zero External Teacher
# Canonical ShanghaiTech Part B Partition (400 Train / 316 Test)

data:
  train_manifest: data/shb_train_all.jsonl
  val_manifest:   data/shb_test.jsonl
  crop_size:      512
  scale_range:    [0.70, 1.35]
  hflip_prob:     0.5
  brightness_jitter:   0.2
  contrast_jitter:     0.2
  gamma_jitter:        [0.6, 1.5]
  preload:             true
  random_invert_prob:  0.0

model:
  output_stride: 4
  feature_width: 32
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained:    true
  backbone_lr_scale: 0.1
  init_m0:       0.002500

  # High Receptive Field Neck with Global Context (10,784 parameters)
  neck_type:      aspp_lite
  use_aspp_gap:   true
  aspp_dilations: [1, 3, 6]

  # Mathematical Operator 1: Clean Macro-Scale Isotropic Geometry [32, 64, 128] px
  region_sizes_px:   [32, 64, 128]
  region_overlap:    0.5
  include_full_image: false

  regional_feature_stats: mean
  region_head_hidden:     48

  # Dynamic Scale Routing: Standard 1D Simplex over K=3 Monotonic Scales (483 parameters)
  dynamic_scale_routing:    true
  factorized_scale_routing: false
  scale_router_temperature: 1.0

  # Mathematical Operator 2: Pre-Solver Scale-Consistency Reliability Gating (0 parameters)
  pre_solver_scale_gating: true
  scale_gating_power:      1.0

  foreground_gate:            false
  dynamic_trust_gate:         false
  use_top_down_semantic_gate: false
  scale_conditioned_prior:    false

  # Unrolled Measure Reconstruction Solver (T=6)
  enable_solver:   true
  solver_mode:     additive
  iterations:      6
  omega:           1.0
  residual_clip:   0.0
  eps:             1.0e-6

  # Mathematical Operator 3: Radon-Nikodym Measure-Modulated Adjoint Field (0 parameters)
  adjoint_mode:    radon_nikodym

  # Mathematical Operator 4: Bayesian Morozov Discrepancy Deadband Shrinkage (0 parameters)
  morozov_gamma:   0.75

  # Mathematical Operator 5: Pure SNR Reliability Weighting
  reliability_mode: snr
  reliability_rate_std_floor:      0.01
  reliability_weight_min:          0.25
  reliability_weight_max:          4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver:    true
  detach_reliability_in_solver:    true

  # Trust-Region Bounded Relative Adjustments
  trust_region_kappa: 0.35
  trust_region_floor: 0.005

  tv_lambda:       0.02
  tv_type:         laplacian

  # Firm Thresholding (MCP): zero shrinkage on crowd peaks, deadband on background
  proximal_tau:    0.015
  proximal_mode:   firm
  proximal_mu:     3.0

  dispersion_init: 50.0
  dispersion_min:  0.5
  dispersion_max:  500.0

  hurdle_head:    true
  temp_softplus:  true
  use_coord_attn: false

  ema_decay:      0.999

  # RMR-v17/v19 Breakthrough Mathematical Upgrades
  density_curvature:          true
  gated_density_curvature:    true
  curvature_dense_threshold:  0.15
  curvature_gate_beta:        0.03
  curvature_pool_kernel:      8

  use_barzilai_borwein: true
  use_scale_entropy_trust: true

  # RMR-v32: Baseline Invariants
  use_cpcm: false
  cpcm_hidden: 8
  floor_tau: 0.0

loss:
  allocation_loss_type: flat_dm16
  kappa_flat16:         20.0
  normalize_flat_dm16:  true
  dm_target:        dual

  lambda_count:     1.0
  lambda_flat_dm16: 1.0
  lambda_cell:      0.50
  lambda_region_nb: 0.20
  lambda_hurdle:    0.10
  lambda_trunc_nb:  0.20

  count_loss_mode:    nb
  count_nb_dispersion: 50.0

  cell_loss_mode:         mass_weighted
  cell_beta:              1.0
  cell_mass_weight_eps:   0.001
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25

  lambda_scale_align:     0.05
  scale_align_tau_dense:  0.12
  scale_align_tau_sparse: 0.03
  scale_align_kernel:     5
  scale_align_mask_bg:    true

  lambda_curvature:         0.50
  curvature_gate_threshold: 0.08
  curvature_gate_kernel:    5
  curvature_gate_mode:      hard
  curvature_gate_scale:     0.02

  lambda_hard_bg:   0.15
  hard_bg_ratio:    0.05

  lambda_fg_gate:   0.0

train:
  deterministic: true
  epochs:          1000
  batch_size:      8
  workers:         4
  pin_memory:      true
  lr:              1.0e-4
  backbone_lr_scale: 0.1
  weight_decay:    1.0e-4
  warmup_epochs:   10
  min_lr_ratio:    0.05
  grad_clip:       1.0
  amp:             true
  solver_warmup_epochs: 5
  solver_ramp_epochs:   20
  early_stopping:  false
  patience:        0
  eval_every:      5

eval:
  density_bins: [50.0, 200.0]

output_dir: runs/shb/rmr_v32_anchor
