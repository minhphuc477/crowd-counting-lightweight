# configs/rmr_v3/probabilistic_uniform.yaml
# V3-A: Probabilistic Uniform (CONTROL VARIANT)
# uniform_reliability: true -> w_R = 1.0 for all regions (identical to B5-P solver)
# This is the V3-A ablation that isolates the effect of learned reliability weighting.
# All other hyperparameters are IDENTICAL to reliability_weighted.yaml.

experiment:
  name: "rmr_v3_probabilistic_uniform"
  seed: 42
  dataset: "sha_a"
  output_stride: 4

model:
  backbone_name: "mobilenetv4_conv_small_050.e3000_r224_in1k"
  pretrained: true
  backbone_lr_scale: 0.1
  feature_width: 32
  region_sizes_px: [32, 64, 128]
  region_overlap: 0.5
  include_full_image: false
  regional_hidden: 48
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0
  rate_std_floor: 0.01
  w_min: 0.25
  w_max: 4.0
  scale_neutral_normalize: true     # moot when uniform_reliability=true
  iterations: 2
  sirt_omega: 1.0
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  uniform_reliability: true          # V3-A: override w_R = 1.0 everywhere
  init_m0: 0.015763
  eps: 1.0e-6

training:
  epochs: 200                    # PILOT run (same as V3-B for direct comparison)
  batch_size: 8
  crop_size: 256
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  scheduler: "cosine"
  grad_clip: 1.0
  amp: true

loss:
  lambda_count: 1.0
  lambda_flat_dm16: 1.0
  lambda_cell: 0.25
  lambda_region_head: 0.20
  count_loss_mode: "nb"
  nb_dispersion: 50.0
  kappa_flat16: 20.0
  cell_beta: 1.0
  region_beta: 0.1
  normalize_flat_dm16: true
  lambda_reliability_entropy: 0.0

eval:
  val_file: "data/sha_a_val.jsonl"
  density_bins: [25.0, 200.0]
  run_diagnostics: true

checkpoint:
  metric: "val_mae"
  mode: "min"
  save_best: true
  save_last: true

# Comparison protocol (Section 28):
#   V3-A is the causal control for V3-B.
#   Pilot success gate: V3-B must reduce Moderate MAE vs V3-A.
#   Dense MAE must not degrade > 3%. Overall MAE and RMSE must not regress.
