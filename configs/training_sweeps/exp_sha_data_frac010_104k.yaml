data:
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  crop_size: 512
  data_root: data
  erasing_max_patches: 3
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_scale:
  - 0.005
  - 0.03
  gamma_jitter:
  - 0.6
  - 1.5
  grayscale_prob: 0.3
  hflip_prob: 0.5
  pad_small_images: true
  random_erasing_prob: 0.35
  random_invert_prob: 0.0
  saturation_jitter: 0.3
  scale_range:
  - 0.6
  - 1.4
  train_manifest: data/sha_a_train_frac010.jsonl
  val_manifest: data/sha_a_test.jsonl
eval:
  density_bins:
  - 100.0
  - 500.0
loss:
  allocation_loss_type: dual_bayesian_radon_ot
  bayesian_adaptive_sigma: true
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true
  bayesian_sigma: 4.0
  bayesian_sigma_max: 4.0
  bayesian_sigma_min: 2.0
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  dm_target: dual
  lambda_bayesian: 0.15
  lambda_cell: 0.0
  lambda_count: 0.5
  lambda_flat_dm16: 0.0
  lambda_radon_ot: 0.85
  lambda_region_nb: 0.0
  output_stride: 2
  radon_ot_norm_ref: 100.0
  radon_ot_projections: 4
model:
  aspp_dilations:
  - 2
  - 4
  - 8
  backbone_lr_scale: 0.1
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  enable_solver: false
  eps: 1.0e-06
  feature_width: 32
  init_m0: 0.00394075
  max_trainable_params: 104441
  neck_type: aspp_lite
  output_stride: 2
  pretrained: true
  solver_mode: direct
  subpixel_stride2: true
  use_aspp_gap: true
  enable_regional_head: false
output_dir: runs_fixed/benchmarks/sweeps_train/exp_sha_data_frac010_104k
seed: 42
train:
  amp: true
  backbone_lr_scale: 0.1
  batch_size: 8
  deterministic: true
  early_stopping: false
  epochs: 1500
  eval_every: 5
  grad_clip: 1.0
  lr: 0.0001
  min_lr_ratio: 0.05
  patience: 0
  pin_memory: true
  warmup_epochs: 15
  weight_decay: 0.0001
  workers: 4
