# ==============================================================================
# SUB-60 EXPERIMENT 5: Grand Synthesis (SOTA Sub-60 Master - 174k Parameters)
# Framework: Radon Measure Recovery (RMR) for Crowd Counting
# Target: ShanghaiTech Part A (Official 300 Train / 182 Test Partition, 0.0% KD)
# Scientific Question:
# What is the cumulative empirical performance when unifying Subpixel Stride 2,
# 174k representation capacity, Faithful Beta-NB uncompressed regional regression,
# Zero-Flux Multiscale Morozov inverse solving (T=6), and WSD optimization?
# Target: 50–58 MAE on ShanghaiTech Part A (< 300k parameters, 0.0% KD).
# Trainable Parameters: Exactly ~174,340 (<= 200,000 budget, 0.0% KD)
# Memory Optimizations: workers=2, num_threads=2, pin_memory=true
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
    - 0.7
    - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
    - 0.6
    - 1.5
  random_invert_prob: 0.0
  pad_small_images: true

model:
  output_stride: 2
  subpixel_stride2: true
  subpixel_dm: false
  feature_width: 80
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763
  max_trainable_params: 200000

  # Neck: HDC-Lite (dilations 1, 2, 3)
  neck_type: hdc_lite
  use_aspp_gap: true
  hdc_dilations:
    - 1
    - 2
    - 3

  # Multi-scale Region Geometry
  region_sizes_px:
    - 32
    - 64
    - 128
  region_overlap: 0.5
  include_full_image: false
  regional_feature_stats: mean
  region_head_hidden: 140

  # Dynamic Scale Routing
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false

  # Deep Inverse Solver (RO2 ACTIVE: T=6 Iterations + Multiscale Morozov)
  enable_solver: true
  solver_mode: additive
  iterations: 6
  omega: 1.0
  residual_clip: 0.0
  eps: 1.0e-06
  adjoint_mode: radon_nikodym
  morozov_gamma: 0.75
  morozov_rho_cap: 0.25
  multiscale_morozov: true
  morozov_scale_beta: 1.0
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  detach_y0_for_solver: false
  trust_region_kappa: 0.35
  trust_region_floor: 0.005
  use_barzilai_borwein: true
  use_scale_entropy_trust: true

  # TV Diffusion (RO2 ACTIVE: Zero-Flux Symmetric Product Conductance c_ij = g_c * g_n)
  tv_lambda: 0.02
  tv_type: laplacian
  density_gated_diffusion: true
  diffusion_dense_threshold: 0.12
  diffusion_gate_beta: 0.03
  proximal_tau: 0.015
  proximal_mode: firm
  proximal_mu: 3.0
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0

  # Density Activation & Curvature
  hurdle_head: true
  hurdle_gating_mode: occupancy
  faithful_dispersion_detach: true
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999
  density_curvature: true
  gated_density_curvature: true
  curvature_dense_threshold: 0.15
  curvature_gate_beta: 0.03
  curvature_pool_kernel: 9
  curvature_alpha_init: -4.0

loss:
  output_stride: 2
  allocation_loss_type: flat_dm16
  kappa_flat16: 10.0
  dm_block_px: 16
  normalize_flat_dm16: true
  dm_norm_mode: count
  dm_ref_count: 100.0
  dm_strict: true
  auto_scale_kappa: true
  dm_target: dual

  # Macro Mass & Spatial Carrier Supervision
  lambda_count: 1.0
  lambda_bayesian: 0.0
  lambda_flat_dm16: 1.0
  lambda_cell: 0.50
  cell_loss_mode: count_harmonized
  cell_norm_power: 0.5
  cell_norm_ref: 100.0
  cell_beta: 1.0
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25
  cell_fg_ratio: 0.67

  # Regional NB Loss (RO1 ACTIVE: Faithful Beta-NB + Decoupled Variance)
  lambda_region_nb: 0.20
  regional_nb_beta: 1.0
  faithful_regional_nb: true
  lambda_hurdle: 0.10
  lambda_trunc_nb: 0.0
  count_loss_mode: nb
  count_nb_dispersion: 50.0

train:
  device: cuda
  epochs: 700
  batch_size: 8
  workers: 2
  num_threads: 2
  pin_memory: true
  optimizer: adamw
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 10
  min_lr_ratio: 0.05
  scheduler_type: wsd
  wsd_stable_ratio: 0.70
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
    - 100.0
    - 500.0

output_dir: runs/sha_a/sub60_exp5_grand_synthesis_174k
