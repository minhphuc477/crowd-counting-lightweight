# SUB60-E127: Tight Adaptive Bayesian Loss with Balanced Gradient Magnitude (Goal 1 Upgrade)
# Scientific Purpose:
# Empirically, sub60_e108a (Bayesian + Bounded Morozov) achieved a champion low RMSE of 123.48
# (compared to 140.81 for Flat DM16 sub60_e115), proving Bayesian coordinate posteriors produce
# significantly lower prediction variance and extreme outlier error.
# However, old Bayesian runs underperformed on MAE due to:
# 1. Fixed sigma=8.0px causing 88.25% Gaussian overlap blur between adjacent heads (d_1NN ~ 4.52px).
# 2. 63x gradient magnitude starvation in e118 (lambda=0.05 vs count loss ~150).
# 3. Mass erosion from hurdle_gating_mode: product (-20% to -25% count in dense clusters).
# 4. Zero-support trapping in Radon-Nikodym adjoint (0 * delta = 0).
#
# SUB60-E127 Cures:
# 1. Tight Adaptive Bandwidth: sigma_n = clamp(0.5 * d_knn, 2.0, 4.0), collapsing Gaussian overlap
#    from 88.25% down to 13.53% at dense heads to preserve sharp distinct peaks.
# 2. Gradient Magnitude Parity: bayesian_norm_mode: square_root, lambda_flat_dm16: 0.50,
#    bringing point supervision gradient magnitude to parity with count loss (~25 vs ~30-50).
# 3. Unbiased Hurdle Occupancy: hurdle_gating_mode: occupancy (100% mass preservation for b >= 1.0).
# 4. Inoculated Adjoint: scale_seeded_carrier: true (eps=0.02) to break zero-support trapping.
# 5. Bounded Morozov: morozov_rho_cap: 0.25, gamma: 0.75 (protects moderate/sparse from deadband leaks).
# 6. Physical Scale: pad_small_images: true (protects 17.64 Sparse MAE record).
# Invariants: 101,763 trainable params (<= 104,441), Standalone (0.0% KD), ShanghaiTech Part A.
seed: 42
data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
  - 0.7
  - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  pad_small_images: true
model:
  output_stride: 4
  feature_width: 32
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763
  neck_type: aspp_lite
  use_aspp_gap: true
  aspp_dilations:
  - 1
  - 3
  - 6
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  regional_feature_stats: mean
  region_head_hidden: 48
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false
  enable_solver: true
  solver_mode: additive
  iterations: 6
  omega: 1.0
  residual_clip: 0.0
  eps: 1.0e-06
  adjoint_mode: radon_nikodym
  morozov_gamma: 0.75
  morozov_rho_cap: 0.25
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  detach_y0_for_solver: false
  trust_region_kappa: 0.35
  trust_region_floor: 0.005
  density_adaptive_trust: false
  asymmetric_trust: false
  scale_seeded_carrier: true
  scale_seed_eps: 0.02
  tv_lambda: 0.02
  tv_type: laplacian
  proximal_tau: 0.015
  proximal_mode: firm
  proximal_mu: 3.0
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0
  hurdle_head: true
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999
  density_curvature: true
  gated_density_curvature: true
  curvature_dense_threshold: 0.15
  curvature_gate_beta: 0.03
  curvature_pool_kernel: 8
  curvature_alpha_init: -8.0
  use_barzilai_borwein: true
  use_scale_entropy_trust: true
  hurdle_gating_mode: occupancy
loss:
  allocation_loss_type: bayesian
  bayesian_sigma: 4.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 4.0
  bayesian_background_ratio: 0.10
  bayesian_norm_mode: square_root
  bayesian_canonical_bg: true
  dm_target: dual
  lambda_count: 1.0
  lambda_flat_dm16: 0.50
  lambda_cell: 0.0
  lambda_region_nb: 0.2
  lambda_hurdle: 0.1
  lambda_trunc_nb: 0.2
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  lambda_scale_align: 0.05
  scale_align_tau_dense: 0.12
  scale_align_tau_sparse: 0.03
  scale_align_kernel: 5
  scale_align_mask_bg: true
  lambda_curvature: 0.5
  curvature_gate_threshold: 0.08
  curvature_gate_kernel: 5
  curvature_gate_mode: hard
  curvature_gate_scale: 0.02
  lambda_hard_bg: 0.15
  hard_bg_ratio: 0.05
  lambda_fg_gate: 0.0
train:
  epochs: 1000
  batch_size: 8
  workers: 0
  pin_memory: true
  num_threads: 2
  cudnn_benchmark: false
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 10
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false
eval:
  density_bins:
  - 100.0
  - 500.0
output_dir: runs/sha_a/sub60_e127_tight_adaptive_bayesian_balanced
