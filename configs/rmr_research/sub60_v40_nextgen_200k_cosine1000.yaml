# ==============================================================================
# SUB-60 V40 NEXT-GEN 200K RECIPE: 1000-Epoch Cosine Annealing Optimization
# Framework: Radon Measure Recovery (RMR) for Crowd Counting
# Target Benchmark: ShanghaiTech Part A (Official 300 Train / 182 Test, 0.0% KD)
# Budget Constraint: Strictly <= 200,000 Trainable Parameters (Actual: 152,755)
#
# SCIENTIFIC SPECIFICATION:
# 1. Architecture: Track B Stride-2 Dual-Lattice Carrier + BiFPN-Lite (C=64)
# 2. Heads: Large-Kernel 7x7 Subpixel Allocation Head + Hurdle Occupancy Head
# 3. Optimizer: AdamW (lr=1e-4 for heads, lr=1e-5 for backbone, weight_decay=1e-4)
# 4. Scheduler: Standard Cosine Annealing (1000 Epochs, warmup=10 ep, min_lr_ratio=0.05)
#    NO WSD, NO Early Stopping, NO artificial epoch truncation.
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
    - 0.70
    - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
    - 0.6
    - 1.5
  random_invert_prob: 0.0
  pad_small_images: false

model:
  output_stride: 2
  subpixel_dm: true
  subpixel_kernel_size: 7
  subpixel_stride2: false
  feature_width: 64
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763
  max_trainable_params: 200000

  # Neck: BiFPN-Lite (C=64, top-down + bottom-up bi-directional feature fusion)
  neck_type: bifpn_lite
  use_aspp_gap: false

  # Multi-scale Region Geometry
  region_sizes_px:
    - 32
    - 64
    - 128
  region_overlap: 0.5
  include_full_image: false
  regional_feature_stats: mean
  region_head_hidden: 64

  # Dynamic Scale Routing
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false

  # Deep Inverse Solver (T=6 Unrolled SIRT)
  enable_solver: true
  solver_mode: additive
  iterations: 6
  omega: 1.0
  residual_clip: 0.0
  eps: 1.0e-06
  adjoint_mode: radon_nikodym
  morozov_gamma: 0.75
  morozov_rho_cap: 0.25
  reliability_mode: snr
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true
  trust_region_kappa: 0.35
  trust_region_floor: 0.005
  use_barzilai_borwein: true
  use_scale_entropy_trust: true

  # TV Diffusion
  tv_lambda: 0.02
  tv_type: laplacian
  density_gated_diffusion: false
  proximal_tau: 0.015
  proximal_mode: firm
  proximal_mu: 3.0
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0

  # Density Activation & Hurdle
  hurdle_head: true
  hurdle_gating_mode: occupancy
  faithful_dispersion_detach: true
  head_activation: softplus
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999
  density_curvature: true
  gated_density_curvature: true
  curvature_dense_threshold: 0.15
  curvature_gate_beta: 0.03
  curvature_pool_kernel: 8
  curvature_alpha_init: -8.0
  asymmetric_trust: false

loss:
  allocation_loss_type: flat_dm16
  kappa_flat16: 20.0
  normalize_flat_dm16: true
  dm_target: dual

  # Macro & Spatial Carrier Supervision
  lambda_count: 1.0
  lambda_flat_dm16: 1.0
  lambda_cell: 0.5
  cell_loss_mode: count_harmonized
  cell_beta: 1.0
  cell_mass_weight_eps: 0.001
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25
  cell_norm_power: 0.5
  cell_norm_ref: 100.0

  # Regional Evidence Head Supervision
  lambda_region_nb: 0.20
  regional_nb_beta: 1.0
  faithful_regional_nb: true
  lambda_hurdle: 0.05
  lambda_trunc_nb: 0.0
  count_loss_mode: l1

  # Auxiliary regularizers
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  device: cuda
  epochs: 1000
  batch_size: 4
  gradient_accumulation_steps: 2
  workers: 2
  num_threads: 2
  pin_memory: true

  # Learning Rate Architecture
  optimizer: adamw
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  grad_clip: 1.0

  # Standard Cosine Annealing
  scheduler_type: cosine
  warmup_epochs: 10
  min_lr_ratio: 0.05

  # Precision & Stabilization
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20

  # Strict full-run policy: NO early stopping, NO premature epoch truncation
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
    - 100.0
    - 500.0

output_dir: runs/sha_a/sub60_v40_nextgen_200k_cosine1000
