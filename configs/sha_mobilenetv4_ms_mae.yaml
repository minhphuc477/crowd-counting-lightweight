# MobileNetV4 + Multi-Scale Block MAE Loss (L_MS over 16, 32, 64) + Direct L1 + Frozen Disp
experiment:
  name: mobilenetv4_ms_mae
  seed: 42
  save_dir: ./runs/mobilenetv4_ms_mae

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16
  # Correct timm/MobileNetV4 Inception normalization (x -> 2x - 1)
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

model:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  pretrained: true
  neck_width: 32
  context_dilations: [1, 2, 3]
  eps_d: 1.0e-6
  data_driven_head_bias: true

loss:
  lambda_count: 1.0               # Global image count constraint
  count_scale: 100.0
  lambda_ms_mae: 1.0              # Direct Multi-Scale Block MAE over 16, 32, 64 px
  lambda_point: 0.0
  lambda_hnb: 0.25                # Probabilistic regularizer
  lambda_alloc: 0.0               # Replaced by direct MS-MAE
  lambda_hn: 0.10
  lambda_empty: 0.25
  lambda_global: 0.10
  lambda_rob: 0.05
  lambda_route: 0.0
  hard_negative_fraction: 0.10
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false         # Frozen dispersion
  enable_curriculum: false

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.20

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: adamw
  lr: 1.0e-4
  lr_start: 1.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

schedule:
  epochs: 2000
  warmup_epochs: 50
  cosine: true

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  save_best_by: mae
