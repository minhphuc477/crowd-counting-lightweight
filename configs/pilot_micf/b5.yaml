augmentation:
  flip_prob: 0.5
  scale_range:
  - 0.7
  - 1.3
dataset:
  coordinate_base: 0
  crop_size: 256
  image_mean:
  - 0.5
  - 0.5
  - 0.5
  image_std:
  - 0.5
  - 0.5
  - 0.5
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  context_dilations:
  - 1
  - 2
  - 3
  eps_d: 1.0e-08
  neck_width: 32
  output_stride: 16
  pretrained: true
  head_type: cumulative
  use_integral_context: true
optimizer:
  backbone_lr_scale: 0.1
  grad_clip: 500.0
  lr: 0.0002
  name: AdamW
  weight_decay: 0.0001
schedule:
  epochs: 100
  warmup_epochs: 5
training:
  amp: true
  batch_size: 16
  drop_last: true
  evaluate_every: 2
  num_workers: 2
experiment:
  name: pilot_micf_b5
  model_id: B5
  description: MICF-v2 Full (Directional Context + Validity)
  seed: 42
  save_dir: ./runs/pilot_micf/b5
loss:
  mode: micf
  lambda_valid: 1.0
  lambda_count: 0.5
