experiment:
  name: pilot_micf_b9
  model_id: B9
  description: "FH-CMICF K16 on P4 Stride-4 High-Resolution Carrier with Directional Integral Context"
  save_dir: ./runs/pilot_micf/b9
  seed: 42

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 256
  coordinate_base: 0
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  neck_width: 32
  context_dilations: [1, 2, 3]
  use_integral_context: true
  context_type: directional
  head_type: cumulative
  output_stride: 4
  extent_aware: true
  finite_horizon: 16
  eps_d: 1.0e-08

loss:
  mode: micf_v2_full
  field_loss: smooth_l1
  lambda_valid: 1.0
  lambda_local_recon: 0.0
  normalize_by: total_count
  norm_eps: 1.0

augmentation:
  scale_range: [0.7, 1.3]
  flip_prob: 0.5
  vflip_prob: 0.5

optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  grad_clip: 5.0

schedule:
  epochs: 1000
  warmup_epochs: 25

training:
  batch_size: 16
  drop_last: true
  amp: true
  num_workers: 0
  pin_memory: false
  evaluate_every: 5
