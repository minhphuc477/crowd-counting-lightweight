# Experiment S1: MobileNetV4 Champion (72.34) Fine-tuned with Teacher 64.68 KD
experiment:
  name: sha_mobilenetv4_kd_s1
  seed: 42
  save_dir: ./runs/mobilenetv4_kd_s1

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

student:
  name: hpc_lite
  backbone: mobilenetv4_conv_small_050
  neck_width: 32
  init_checkpoint: ./runs/mobilenetv4_ms_mae/best.pt

teacher:
  width: 96
  use_p8_context: true
  checkpoint: ./runs/sha_teacher_lite_v2_p8/best.pt

student_ground_truth_loss:
  lambda_count: 1.0
  count_scale: 100.0
  lambda_ms_mae: 1.0
  lambda_hnb: 0.25
  lambda_point: 0.0
  lambda_alloc: 0.0
  lambda_hn: 0.0
  lambda_empty: 0.0
  lambda_global: 0.0
  density_stratified_nb: true

kd:
  student_channels:
    p4: 32
    p8: 32
    p16: 32
  teacher_channels:
    p4: 96
    p8: 96
    p16: 96
  kd_dim: 64
  lambda_map: 0.10
  lambda_feat: 0.05
  lambda_energy: 0.0
  lambda_relation: 0.0
  lambda_count: 0.0
  reliability_gate: false
  ramp_start: 0.0
  ramp_full: 0.0

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5

optimizer:
  student_lr: 1.0e-5
  kd_projector_lr: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 250
  warmup_epochs: 5
  min_ratio: 0.10

training:
  batch_size: 8
  amp: true
  validate_every: 5
  num_workers: 0
