seed: 42

output_dir: runs/sha_b/rmr_v4_native_meanstd_seed42

data:
  train_manifest: data/shb_train_all.jsonl
  val_manifest: data/shb_test.jsonl

  crop_size: 512

  scale_range:
    - 0.75
    - 1.25

  hflip_prob: 0.5
  brightness_jitter: 0.0
  contrast_jitter: 0.0

model:
  output_stride: 4
  feature_width: 32

  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1

  region_sizes_px:
    - 32
    - 64
    - 128

  region_overlap: 0.5
  include_full_image: false

  iterations: 2
  omega: 1.0
  residual_clip: 0.0

  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0

  reliability_mode: nb_rate_variance
  reliability_rate_std_floor: 0.01
  reliability_weight_min: 0.25
  reliability_weight_max: 4.0
  normalize_reliability_within_scale: true

  detach_region_mean_in_solver: true
  detach_reliability_in_solver: true

  # RMR-v4: Native scale pooling + Mean/Std region stats
  native_scale_pooling: true
  regional_feature_stats: mean_std

loss:
  lambda_count: 1.0
  lambda_flat_dm16: 1.0
  lambda_cell: 0.25
  lambda_region_nb: 0.20

  cell_loss_type: bce
  region_loss_type: log_gamma

  # Stage 2: Multiscale DM Loss (P4, P8, P16)
  multiscale_dm: false
  multiscale_dm_strides: [4, 8, 16]
  multiscale_dm_weights: [0.5, 0.25, 0.25]

solver:
  type: stationary_richardson
  inner_iterations: 1
  inner_omega: 1.0
  regularization: 1.0e-4

optimizer:
  name: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4
  betas:
    - 0.9
    - 0.999

scheduler:
  name: cosine
  warmup_epochs: 10
  min_lr: 1.0e-6

training:
  epochs: 300
  batch_size: 8
  gradient_accumulation_steps: 1
  grad_clip_norm: 5.0
  val_interval: 5
  eval_crop_size: null
  num_workers: 4
  pin_memory: true
  mixed_precision: fp16
  early_stopping_patience: 40
  early_stopping_metric: val/mae
