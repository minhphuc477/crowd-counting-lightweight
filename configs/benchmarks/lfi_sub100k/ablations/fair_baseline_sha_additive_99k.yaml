# ==============================================================================
# FAIR SAME-BUDGET BASELINE (SHA): MobileNetV4-S050 + Additive FPN + DW-SubPixel
# Matched 1:1 in backbone, lr=0.0003, blr=0.25, crop=512, epochs=1500, 0% KD
# Loss: Pure Bayesian + NB (no Laplacian HF, no DSIMR, no Radon-OT)
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  data_root: data
  crop_size: 512
  pad_small_images: true
  crowd_aware_crop: true
  crowd_aware_prob: 0.5
  max_size: 2048
  scale_range:
  - 0.6
  - 1.4
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.3
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale:
  - 0.005
  - 0.03
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_max_patches: 3
  erasing_drop_points: true

model:
  output_stride: 2
  subpixel_stride2: true
  subpixel_kernel_size: 3
  head_type: dsimr_subpixel
  dsimr_init_z_s: 0.0
  head_activation: softplus
  density_adaptive_scale: true
  density_scale_gamma: 0.15
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.25
  init_m0: auto
  neck_type: additive
  context_dilations:
  - 1
  - 2
  - 3
  use_aspp_gap: false
  enable_regional_head: false
  enable_solver: false
  solver_mode: direct
  floor_tau: 0.001
  eps: 1.0e-06

loss:
  output_stride: 2
  allocation_loss_type: bayesian
  bayesian_sigma: 8.0
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 8.0
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true
  empty_scene_full_weight: false
  dm_target: dual
  count_loss_mode: anscombe
  count_nb_dispersion: 50.0
  lambda_bayesian: 1.0
  lambda_radon_ot: 0.0
  lambda_flat_dm16: 0.0
  lambda_region_nb: 0.0
  lambda_count: 1.0
  lambda_count_l1: 0.02
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 1500
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0003
  backbone_lr_scale: 0.25
  weight_decay: 0.0001
  warmup_epochs: 15
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  ema_decay: 0.999
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: true

eval:
  density_bins:
  - 100.0
  - 500.0
  run_tiling: false

output_dir: runs_fixed/benchmarks/lfi_sub100k/ablations/fair_baseline_sha_additive_99k
