# Single-seed SFIv2 architecture matrix. Dataset protocol copied unchanged from the existing NWPU benchmark configuration.
# M0: additive control; M1: current full SFIv2; M2: simplified SFI; M3: simplified SFI without HDC.
seed: 42
data:
  train_manifest: data/nwpu_train.jsonl
  val_manifest: data/nwpu_val.jsonl
  test_manifest: data/nwpu_test.jsonl
  data_root: data
  crop_size: 512
  pad_small_images: true
  max_size: 2048
  scale_range: [0.6, 1.4]
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.3
  gamma_jitter: [0.6, 1.5]
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale: [0.005, 0.03]
  erasing_ratio: [0.5, 2.0]
  erasing_max_patches: 3
model:
  output_stride: 2
  subpixel_stride2: true
  subpixel_kernel_size: 3
  head_type: dsimr_subpixel
  head_activation: softplus
  density_adaptive_scale: true
  density_scale_gamma: 0.15
  feature_width: 32
  max_trainable_params: 104441
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.00158
  neck_type: sfi_lite
  sfi_norm_free_hf: false
  sfi_use_hdc_proj: true
  sfi_hdc_proj_groups: 2
  sfi_use_laplacian: true
  sfi_decomp_mode: haar
  sfi_use_selective_gate: false
  sfi_gate_mode: additive
  sfi_use_hdc: false
  hdc_dilations: [1, 2]
  sfi_hf_norm_mode: gn
  use_aspp_gap: false
  enable_regional_head: false
  enable_solver: false
  solver_mode: direct
  floor_tau: 0.001
  eps: 1.0e-06
loss:
  output_stride: 2
  allocation_loss_type: dual_bayesian_radon_ot
  bayesian_sigma: 8
  bayesian_adaptive_sigma: true
  bayesian_sigma_min: 2.0
  bayesian_sigma_max: 8
  bayesian_background_ratio: 0.05
  bayesian_canonical_bg: true
  empty_scene_full_weight: true
  lambda_radon_ot: 0.85
  radon_ot_projections: 4
  radon_ot_norm_ref: 100.0
  radon_ot_scale_by_length: false
  dm_target: dual
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  lambda_bayesian: 0.15
  lambda_flat_dm16: 0.0
  lambda_region_nb: 0.0
  lambda_count: 0.5
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0
train:
  epochs: 800
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 15
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  ema_decay: 0.999
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: true
eval:
  density_bins: [100.0, 500.0]
output_dir: runs/benchmarks/sfi_v2_matrix/nwpu_m3_simplified_sfi_no_hdc

