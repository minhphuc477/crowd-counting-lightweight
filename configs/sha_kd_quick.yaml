# Quick Student KD Continuation from 76.49 Baseline (Phase Q)
experiment:
  name: sha_kd_quick_from_7649
  seed: 42
  save_dir: ./runs/sha_kd_quick_from_7649

student:
  name: hpc_lite_sr48
  neck_width: 48
  init_checkpoint: ./runs/sha/best.pt
  deployment_architecture_unchanged: true

teacher:
  type: teacher_lite
  width: 96
  checkpoint: ./runs/sha_teacher_lite/best.pt
  frozen: true

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

student_ground_truth_loss:
  lambda_count: 1.0
  count_scale: 100.0
  lambda_point: 0.0
  lambda_hnb: 0.35
  lambda_alloc: 0.15
  lambda_hn: 0.10
  lambda_empty: 0.25
  lambda_global: 0.10
  lambda_rob: 0.05
  lambda_route: 0.10
  hard_negative_fraction: 0.10
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false
  enable_curriculum: false

kd:
  kd_dim: 64
  student_channels:
    p4: 48
    p8: 48
    p16: 48
  teacher_channels:
    p4: 96
    p8: 96
    p16: 96
  lambda_feat: 0.10
  lambda_energy: 0.05
  lambda_relation: 0.05
  lambda_map: 0.20
  lambda_count: 0.05
  reliability_gate: true
  ramp_start: 0.05
  ramp_full: 0.20

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.20

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: adamw
  student_lr: 2.0e-5
  kd_projector_lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0

schedule:
  epochs: 300
  warmup_epochs: 15
  cosine: true
  min_lr: 1.0e-6

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  validate_every: 5
  save_best_by: mae
