# V51 Ablation B5: Track B Dense Synthesis WITHOUT Solver (enable_solver: false)
# Purpose: Quantify the exact value added by the Unrolled SIRT Inverse Solver over feedforward carrier y0
seed: 42
data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  scale_range:
  - 0.7
  - 1.35
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0

model:
  output_stride: 2
  feature_width: 64
  max_trainable_params: 200000
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763
  neck_type: rep_aspp_lite
  use_aspp_gap: true
  aspp_dilations:
  - 1
  - 3
  - 6
  subpixel_stride2: true
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  native_scale_pooling: true
  regional_feature_stats: mean_std
  region_head_hidden: 64
  dispersion_init: 50.0
  dispersion_min: 0.5
  dispersion_max: 500.0
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  hurdle_head: false
  hurdle_gating_mode: occupancy
  temp_softplus: true
  density_curvature: true
  gated_density_curvature: true
  curvature_dense_threshold: 0.15
  curvature_gate_beta: 0.03
  curvature_pool_kernel: 8
  curvature_alpha_init: -1.5
  scale_prior_boost: 0.20
  enable_solver: false

loss:
  output_stride: 2
  allocation_loss_type: flat_dm16
  kappa_flat16: 20.0
  normalize_flat_dm16: true
  dm_target: y0
  lambda_count: 1.0
  lambda_flat_dm16: 1.0
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  lambda_region_nb: 0.2
  faithful_regional_nb: true
  regional_nb_beta: 0.5
  lambda_cell: 0.35
  cell_loss_mode: count_harmonized
  cell_beta: 1.0
  cell_mass_weight_eps: 0.001
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25
  cell_fg_ratio: 0.67
  cell_norm_power: 0.5
  cell_norm_ref: 100.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 1000
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 10
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 5
  solver_ramp_epochs: 20
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
  - 100.0
  - 500.0
