experiment:
  name: factorial_c_crop448_c16
  seed: 42
  save_dir: ./runs/factorial_c_crop448_c16

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  coordinate_base: 0
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

model:
  backbone: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  features: [C4, C8, C16]
  neck_width: 32
  context_dilations: [1, 2, 3]
  use_p8_context: false
  use_repblock: false
  eps_d: 1.0e-08
  output_stride: 4

statistics:
  seed: 12345
  root_dispersion: 50.0
  max_samples: null
  crops_per_image: 3

loss:
  mode: r2_flat_dm
  root_loss: nb
  kappa_flat16: 20.0
  w_root_nb: 1.0
  w_flat_16: 1.0

augmentation:
  scale_range: [0.7, 1.3]
  flip_prob: 0.5

sampler:
  weighted: false

optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  grad_clip: 500.0

schedule:
  epochs: 1500
  warmup_epochs: 25

training:
  batch_size: 16
  drop_last: true
  amp: true
  init_scale: 256.0
  num_workers: 0
  evaluate_every: 5
  gradient_audit_every: 50
