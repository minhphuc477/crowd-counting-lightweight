experiment:
  name: hpc_s_sr48_sha
  seed: 42
  save_dir: ./runs/sha

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16

model:
  name: hpc_lite_sr48
  backbone: shufflenet_v2_x0_5
  pretrained: true
  neck_width: 48
  route_temperature: 1.0
  pool_kernels: [3, 5, 7]
  pool_residual_mix: 0.5
  simam_lambda: 1.0e-4
  head_kernel: 5
  output_stride: 4
  eps_d: 1.0e-6
  data_driven_head_bias: true

loss:
  lambda_hnb: 1.0
  lambda_alloc: 0.5
  lambda_hn: 0.25
  lambda_empty: 0.5
  lambda_global: 0.5
  lambda_direct: 0.5
  lambda_special: 0.25
  lambda_rob: 0.1
  lambda_kd: 0.0
  hard_negative_fraction: 0.10
  special_alloc_beta: 1.0
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  enable_curriculum: true

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.30
  brightness: 0.20
  contrast: 0.20
  saturation: 0.15
  blur_prob: 0.20
  gamma_min: 0.35
  gamma_max: 1.80
  salt_pepper_prob: 0.15
  jpeg_prob: 0.20
  noise_prob: 0.20

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: adamw
  backbone_lr: 2.5e-5
  head_lr: 1.0e-4
  dispersion_lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

schedule:
  epochs: 500
  warmup_fraction: 0.05
  cosine: true

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  save_best_by: mae
