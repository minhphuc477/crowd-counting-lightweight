experiment:
  name: hpc_s_sr48_sha_point_mass
  seed: 42
  save_dir: ./runs/sha

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16

model:
  name: hpc_lite_sr48
  backbone: shufflenet_v2_x0_5
  pretrained: true
  neck_width: 48
  route_temperature: 1.0
  pool_kernels: [3, 5, 7]
  pool_residual_mix: 0.5
  simam_lambda: 1.0e-4
  head_kernel: 5
  output_stride: 4
  eps_d: 1.0e-6
  data_driven_head_bias: true

# Refined Point-Neighbor Mass Decomposition Objective
loss:
  lambda_count: 1.0
  count_scale: 100.0
  lambda_point: 1.0               # Voronoi person-level unit mass conservation
  lambda_hnb: 0.25                 # Multi-scale probabilistic regularizer
  lambda_alloc: 0.0               # Deprecated in favor of point loss
  lambda_hn: 0.10                 # Hard negative suppression on false blocks
  lambda_empty: 0.25              # Whole-image empty suppression
  lambda_global: 0.10             # Smooth L1 log-count stability
  lambda_rob: 0.05
  lambda_kd: 0.0
  lambda_route: 0.10              # SSER pyramid routing supervision
  hard_negative_fraction: 0.10
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false
  enable_curriculum: true

# Clean data scaling (aspect-ratio preserving, [0.8, 1.25])
augmentation:
  scale_range: [0.80, 1.25]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.20
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  blur_prob: 0.15
  gamma_min: 0.50
  gamma_max: 1.50
  salt_pepper_prob: 0.0
  jpeg_prob: 0.0
  noise_prob: 0.0

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

optimizer:
  name: adamw
  lr: 5.0e-5                      # Clean restarted LR for fine-tuning from best.pt
  lr_start: 1.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

schedule:
  epochs: 150                     # 150 epochs continuation
  warmup_epochs: 10               # 10 epochs quick warmup
  cosine: true

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  save_best_by: mae
