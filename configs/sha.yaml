experiment:
  name: hpc_s_sr48_sha_exp1_direct_count
  seed: 42
  save_dir: ./runs/sha

dataset:
  name: sha
  part: part_A
  root: ./data/ShanghaiTech
  crop_size: 448
  output_stride: 4
  hnb_blocks: [16, 32, 64]
  allocation_block: 16

model:
  name: hpc_lite_sr48
  backbone: shufflenet_v2_x0_5
  pretrained: true
  neck_width: 48
  route_temperature: 1.0
  pool_kernels: [3, 5, 7]
  pool_residual_mix: 0.5
  simam_lambda: 1.0e-4
  head_kernel: 5
  output_stride: 4
  eps_d: 1.0e-6
  data_driven_head_bias: true

# Experiment 1: Direct Count Loss revision
# DirectCountL1Loss (lambda_count=1.0) is now the primary objective.
# HNB demoted to probabilistic regularizer (0.35).
# Allocation reduced to spatial regularizer (0.15).
# NB dispersion frozen (learn_dispersion=false) to force mean prediction to absorb error.
loss:
  lambda_count: 1.0
  count_scale: 100.0
  lambda_hnb: 0.35
  lambda_alloc: 0.15
  lambda_hn: 0.10
  lambda_empty: 0.25
  lambda_global: 0.10
  lambda_rob: 0.05
  lambda_kd: 0.0
  lambda_route: 0.1
  hard_negative_fraction: 0.10
  special_alloc_beta: 1.0
  density_stratified_nb: true
  global_count_mode: log_smooth_l1
  learn_dispersion: false
  enable_curriculum: true

augmentation:
  scale_range: [0.75, 2.0]
  flip_prob: 0.5
  safe_crop: true
  max_crop_attempts: 20
  crop_guard_nn_factor: 0.20
  crop_guard_min_px: 8
  crop_guard_max_px: 48
  large_nn_threshold_px: 48
  true_border_threshold_px: 32
  random_crop_prob: 0.75
  large_center_crop_prob: 0.15
  border_center_crop_prob: 0.10

robustness:
  second_view_prob: 0.30
  brightness: 0.20
  contrast: 0.20
  saturation: 0.15
  blur_prob: 0.20
  gamma_min: 0.35
  gamma_max: 1.80
  salt_pepper_prob: 0.15
  jpeg_prob: 0.20
  noise_prob: 0.20

sampler:
  weighted: true
  density_bins: 5
  luminance_bins: 4
  power: 0.5

# Experiment 1: uniform LR=1e-4 for all model params (no backbone split)
optimizer:
  name: adamw
  lr: 1.0e-4
  lr_start: 1.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

schedule:
  epochs: 2000
  warmup_epochs: 50   # 50-epoch linear warmup: 1e-5 -> 1e-4
  cosine: true        # cosine decay: 1e-4 -> 1e-6 over epochs 50-2000

training:
  effective_batch_size: 16
  batch_size: 16
  accum_steps: 1
  amp: true
  num_workers: 0
  save_best_by: mae
