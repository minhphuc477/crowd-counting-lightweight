seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest:   data/sha_a_test.jsonl
  crop_size:      512
  scale_range:    [0.70, 1.35]
  hflip_prob:     0.5
  brightness_jitter:   0.2
  contrast_jitter:     0.2
  gamma_jitter:        [0.6, 1.5]
  random_invert_prob:  0.0

model:
  output_stride: 4
  feature_width: 32
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained:    true
  backbone_lr_scale: 0.1
  init_m0:       0.015763

  # High Receptive Field Neck with Global Context
  neck_type:      aspp_lite
  use_aspp_gap:   true
  aspp_dilations: [1, 3, 6]

  # Pure Isotropic Geometry: strictly square regions to eliminate phantom mass back-projection
  region_sizes_px:   [32, 64, 128]
  region_overlap:    0.5
  include_full_image: false

  # Safe Feature Representation: pure spatial mean eliminates foliage/texture false count blowups
  regional_feature_stats: mean
  region_head_hidden:     48

  # Dynamic Scale Routing (RMR-v10): 483 parameters
  dynamic_scale_routing: true
  scale_router_temperature: 1.0

  # Decoupled Foreground Gating Sub-Head with Deep Background Suppression Floor (RMR-v11/v14): 33 parameters
  foreground_gate: false
  fg_gate_floor:   0.10

  # RMR-v14 Upgrade 1: Top-Down Semantic Context Gating (TDSG): 33 parameters
  # Total model parameters: exactly 104,506 (strictly <= 105,000 budget, 494 headroom)
  use_top_down_semantic_gate: true
  tdsg_floor:                 0.20

  # Measure Reconstruction Solver with Morozov Trust-Region Bounded Updates
  enable_solver:   true
  solver_mode:     additive
  iterations:      6
  omega:           1.0
  residual_clip:   0.0
  eps:             1.0e-6

  # RMR-v13 Native Upgrade 1: Radon-Nikodym Measure-Modulated Adjoint Field
  adjoint_mode:    radon_nikodym

  # RMR-v13 Native Upgrade 2: Bayesian Morozov Discrepancy Deadband Shrinkage
  morozov_gamma:   0.75

  # RMR-v14 Upgrade 2: Hurdle-Gated Hybrid Reliability Weighting
  # Blends rate variance on background (w -> 4.0, aggressive false alarm suppression)
  # with SNR on crowd clumps (w -> 4.0, zero gradient starvation on dense heads)
  reliability_mode: hybrid_hurdle
  reliability_rate_std_floor:      0.01
  reliability_weight_min:          0.25
  reliability_weight_max:          4.0
  normalize_reliability_within_scale: true
  detach_region_mean_in_solver:    true
  detach_reliability_in_solver:    true

  # Trust-Region Bounded Relative Adjustments (RMR-v11)
  trust_region_kappa: 0.35
  trust_region_floor: 0.005

  tv_lambda:       0.02
  tv_type:         laplacian

  # Firm Thresholding (MCP): zero shrinkage on crowd peaks, deadband on background
  proximal_tau:    0.015
  proximal_mode:   firm
  proximal_mu:     3.0

  dispersion_init: 50.0
  dispersion_min:  0.5
  dispersion_max:  500.0

  hurdle_head:    true
  temp_softplus:  true
  use_coord_attn: false

  ema_decay:      0.999

loss:
  allocation_loss_type: flat_dm16
  kappa_flat16:         20.0
  normalize_flat_dm16:  true
  # Symmetric Dual Supervision: 0.5 * L(y0) + 0.5 * L(y) across count, cell, and allocation
  dm_target:        dual

  lambda_count:     1.0
  lambda_flat_dm16: 1.0
  lambda_cell:      0.50
  lambda_region_nb: 0.20
  lambda_hurdle:    0.10
  lambda_trunc_nb:  0.20

  # RMR-v14 Upgrade 3: Foreground-Masked Physical Scale Alignment Loss
  # Restricts KL loss strictly to foreground regions (d_local >= tau_sparse),
  # curing the sparse texture outlier defect on wide-angle pavement (IMG_113)
  lambda_scale_align:     0.05
  scale_align_tau_dense:  0.12
  scale_align_tau_sparse: 0.03
  scale_align_kernel:     5
  scale_align_mask_bg:    true

  # RMR-v12 Density-Gated High-Density Curvature Power Loss (Locks Moderate MAE <= 58.17 & RMSE <= 111.78)
  lambda_curvature:         0.50
  curvature_gate_threshold: 0.08
  curvature_gate_kernel:    5
  curvature_gate_mode:      hard
  curvature_gate_scale:     0.02

  # RMR-v11/v14 Top-K Hard Negative Background Texture Mining Loss
  lambda_hard_bg:   0.15
  hard_bg_ratio:    0.03

  # RMR-v11 Foreground Gate BCE Loss
  lambda_fg_gate:   0.00

  count_loss_mode:    nb
  count_nb_dispersion: 50.0

  # RMR-v11 Power-Weighted Mass Loss
  cell_loss_mode:         mass_weighted
  cell_beta:              1.0
  cell_mass_weight_eps:   0.001
  cell_mass_weight_alpha: 2.0
  cell_mass_weight_gamma: 1.25

train:
  epochs:          1000
  batch_size:      8
  workers:         4
  pin_memory:      true
  lr:              1.0e-4
  backbone_lr_scale: 0.1
  weight_decay:    1.0e-4
  warmup_epochs:   5
  min_lr_ratio:    0.05
  grad_clip:       10.0
  amp:             true
  solver_warmup_epochs: 5
  solver_ramp_epochs:   20
  early_stopping:  false
  patience:        0
  eval_every:      5

eval:
  density_bins: [100.0, 500.0]
