# ==============================================================================
# V71 TRACK B EXPERIMENT 3: PEAK-CONCENTRATED INVERSE SOLVER (PC-BPRO)
# Hypothesis: The Peak-Concentrated Solver (PC-BPRO) resolves the Stride 2
# Resolution Duality by allocating regional count deficits strictly to detected
# head peaks (pi(u)) while leaving background valleys untouched (+0.0% noise).
# Carrier detaching (detach_y0_for_solver: true) eliminates gradient crosstalk.
# Single Variable Control against V71-Exp1 (Direct Baseline):
#   - enable_solver: false -> true
#   - solver_mode: direct -> peak_concentrated
#   - detach_y0_for_solver: true
# Parameter Invariant: Strictly <= 200,000 params (Actual: 122,618 params)
# Empirical Invariant: Exactly 0.0% Knowledge Distillation, 182 Full Test Images
# ==============================================================================

seed: 42

data:
  train_manifest: data/sha_a_train_all.jsonl
  val_manifest: data/sha_a_test.jsonl
  crop_size: 512
  pad_small_images: true
  scale_range:
  - 0.60
  - 1.40
  hflip_prob: 0.5
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.3
  grayscale_prob: 0.30
  gamma_jitter:
  - 0.6
  - 1.5
  random_invert_prob: 0.0
  random_erasing_prob: 0.35
  erasing_scale:
  - 0.005
  - 0.03
  erasing_ratio:
  - 0.5
  - 2.0
  erasing_max_patches: 3

model:
  output_stride: 2
  subpixel_stride2: true
  feature_width: 48
  max_trainable_params: 200000
  backbone_name: mobilenetv4_conv_small_050.e3000_r224_in1k
  pretrained: true
  backbone_lr_scale: 0.1
  init_m0: 0.015763

  # RepASPP-Lite Neck
  neck_type: rep_aspp_lite
  aspp_dilations:
  - 2
  - 4
  - 8
  use_aspp_gap: true

  # Multiscale Regional Evidence Dictionary (Stride 4 grid)
  region_sizes_px:
  - 32
  - 64
  - 128
  region_overlap: 0.5
  include_full_image: false
  use_diag: false
  native_scale_pooling: true
  regional_feature_stats: sum
  region_head_hidden: 96
  dynamic_scale_routing: true
  factorized_scale_routing: false
  scale_router_temperature: 1.0
  pre_solver_scale_gating: true
  scale_gating_power: 1.0
  foreground_gate: false
  dynamic_trust_gate: false
  use_top_down_semantic_gate: false
  scale_conditioned_prior: false

  # Fine Carrier Head
  head_blocks: 1
  hurdle_head: false
  density_curvature: false
  temp_softplus: true
  use_coord_attn: false
  ema_decay: 0.999

  # Peak-Concentrated Inverse Solver (PC-BPRO)
  enable_solver: true
  solver_mode: peak_concentrated
  detach_y0_for_solver: true
  pc_tau_noise: 0.02
  pc_tau_peak: 0.05
  ratio_clamp_max: 5.0
  ratio_clamp_min: 0.2

loss:
  output_stride: 2
  dm_target: dual
  allocation_loss_type: radon_ot
  lambda_radon_ot: 1.0
  radon_ot_projections: 4
  radon_ot_norm_ref: 100.0
  lambda_bayesian: 0.0

  # Macro and Scale-Balanced Regional Loss
  count_loss_mode: nb
  count_nb_dispersion: 50.0
  lambda_count: 0.5
  lambda_count_l1: 0.20
  lambda_region_nb: 0.5
  faithful_regional_nb: true
  regional_nb_beta: 1.0
  normalize_beta_weights: true

  # All Conflicting Auxiliary Losses Eliminated
  lambda_flat_dm16: 0.0
  lambda_cell: 0.0
  lambda_hurdle: 0.0
  lambda_trunc_nb: 0.0
  lambda_scale_align: 0.0
  lambda_curvature: 0.0
  lambda_hard_bg: 0.0
  lambda_fg_gate: 0.0

train:
  epochs: 1500
  batch_size: 8
  workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_scale: 0.1
  weight_decay: 0.0001
  warmup_epochs: 15
  min_lr_ratio: 0.20
  grad_clip: 1.0
  amp: true
  solver_warmup_epochs: 0
  solver_ramp_epochs: 10
  early_stopping: false
  patience: 0
  eval_every: 5
  deterministic: false

eval:
  density_bins:
  - 100.0
  - 500.0

output_dir: runs/sha_a/rmr_v71/v71_track_b_exp3_peak_concentrated_solver
